<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUp School Portal</title>
    <link rel="stylesheet" href="signup.css">
</head>

<body>
    <main class="signup-container">
        <h1>Create Account</h1>
        <p>Join The School Portal</p>

        <form id="signup-form">
            <div class="form-group"><label for="student-name">Student Name</label>
                <input type="text" id="student-name" name="student-name" placeholder="Enter Your Full Name" required
                    autocomplete="name">
            </div>

            <div class="form-group"><label for="student-rollno">Enter Student Roll.No</label>
                <input type="text" id="student-rollno" name="student-rollno" placeholder="Enter Your Roll.No" required>
            </div>

            <div class="form-group"><label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter Your Email" required
                    autocomplete="email">
            </div>

            <div class="form-group"><label for="new-password">Create Password</label>
                <input type="password" id="new-password" name="new-password" placeholder="Enter Your Password" required
                    autocomplete="new-password">
            </div>

            <div class="form-group"><label for="confirmpassword">Confirm Password</label>
                <input type="password" id="confirmpassword" name="confirmpassword"
                    placeholder="Re  Enter Your Password " required autocomplete="new-password">
            </div>
            <button type="submit" class="signup-btn">Create Account</button>
        </form>
        <p class="login-link">Already Have An Account ?
            <a href="login.html">Login</a>
        </p>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="signup.js"></script>
</body>

</html>
